name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one that matters. Every business rule in this project lives in Postgres
  # — capacity, waitlist ordering, the check-in geofence, and every RLS policy —
  # so this job spins up the real Supabase stack, applies all migrations, and
  # runs the suite against it. A policy hole is invisible from the UI and
  # obvious here.
  database:
    name: Database — migrations, RPCs and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version the repo is developed against, and so the
          # action skips the "resolve latest" GitHub API call that rate-limits
          # on busy runners.
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Run database tests
        run: npm run db:test

      - name: Show delivery pipeline state
        # Useful when a run fails: proves whether notifications were enqueued
        # and fanned out, rather than leaving it to guesswork. psql against the
        # exposed local port — `supabase db execute` is not a CLI command, and
        # the old `|| true` was quietly hiding exactly that.
        if: always()
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -c "select status, count(*) from notification_deliveries group by status;" || true

  typecheck:
    name: Typecheck — shared, mobile and admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck --workspaces --if-present

      # Reports, never blocks. These are questions for people rather than
      # defects in the code, and failing the build on them would only teach
      # everybody to ignore a red tick.
      - name: List outstanding placeholders
        if: always()
        continue-on-error: true
        run: npm run check:placeholders

      # A screen with no way in is not a typecheck error and not a test
      # failure — it is a feature nobody can open. This is the one class of bug
      # that shipped fully working and completely unreachable, so it blocks.
      - name: Every screen is reachable
        run: npm run check:reachable

      - name: Build the admin console
        run: npm run build --workspace @mvmnt/admin

  # The suite that asserts what a MEMBER SEES, not that a function returned.
  #
  # Every silent-failure bug in this project was found by a person using the
  # app and by none of the database tests, because those prove the server did
  # its job — not that anybody was told. This job is slow because it drives a
  # real browser against the real stack; that is the cost of catching the one
  # class of bug that keeps escaping.
  visible-outcomes:
    name: End to end — what the member actually sees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase
        run: supabase start

      - name: Apply migrations, seed, and upload the demo media
        run: npm run db:reset

      # Servers and tests in ONE step, deliberately.
      #
      # A `&` in its own step does not survive into the next one — each `run:`
      # is a separate shell, and the first CI attempt failed waiting for
      # servers that had already been killed. Starting them here keeps them in
      # this shell's lifetime, and the trap cleans them up whatever happens.
      - name: Assert every action reports its outcome
        run: |
          set -uo pipefail
          npm run dev --workspace @mvmnt/admin > /tmp/admin.log 2>&1 &
          ADMIN_PID=$!
          (cd apps/mobile && npx expo start --web --port 8081 --non-interactive > /tmp/expo.log 2>&1) &
          EXPO_PID=$!
          trap 'kill $ADMIN_PID $EXPO_PID 2>/dev/null || true' EXIT

          # Both servers on their own terms. Expo's first web bundle is slow on
          # a cold runner, and a fixed sleep is what makes a suite like this
          # flaky.
          up=0
          for i in $(seq 1 60); do
            admin=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173 || true)
            app=$(curl -s -o /dev/null -w '%{http_code}' \
              'http://127.0.0.1:8081/node_modules/expo/AppEntry.bundle?platform=web&dev=true' || true)
            if [ "$admin" = "200" ] && [ "$app" = "200" ]; then up=1; break; fi
            sleep 10
          done
          if [ "$up" != "1" ]; then
            echo "servers never came up: admin=$admin app=$app" >&2
            echo "--- admin log ---"; tail -30 /tmp/admin.log || true
            echo "--- expo log ---";  tail -30 /tmp/expo.log  || true
            exit 1
          fi

          npm run test:e2e

      - name: Server logs, when the suite fails
        if: failure()
        run: |
          echo "--- admin ---"; tail -60 /tmp/admin.log || true
          echo "--- expo ---";  tail -60 /tmp/expo.log  || true

  # Generated types are committed and reviewed as part of each diff. If someone
  # changes a migration without regenerating them, the apps typecheck against a
  # schema that no longer exists — so this fails the build instead of letting it
  # rot silently.
  types-in-sync:
    name: Generated types match the migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version the repo is developed against, and so the
          # action skips the "resolve latest" GitHub API call that rate-limits
          # on busy runners.
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: supabase start

      - name: Regenerate and compare
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts packages/shared/src/database.types.ts; then
            echo "::error::packages/shared/src/database.types.ts is out of date."
            echo "Run: npm run db:types"
            diff /tmp/database.types.ts packages/shared/src/database.types.ts || true
            exit 1
          fi
          echo "Generated types are in sync."
